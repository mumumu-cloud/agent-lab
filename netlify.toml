# Netlify configuration for the agent-lab design asset library prototype.
# The app is a fully static site under asset-library/public (embedded sample
# data + client-side auth), so no build step or serverless functions are needed.

[build]
  base = "asset-library"
  publish = "public"
  command = ""

# Serve the login page at the clean /login path.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
