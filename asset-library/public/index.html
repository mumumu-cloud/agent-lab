<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>디자인 애셋 라이브러리</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <img class="brand-logo brand-logo--light sidebar__logo" src="/img/UROCK_navy.svg" alt="UROCK" />
          <img class="brand-logo brand-logo--dark sidebar__logo" src="/img/UROCK_white.svg" alt="UROCK" />
          <span class="sidebar__brand-text">
            <span class="sidebar__brand-title">Asset Library</span>
            <span class="sidebar__brand-sub">사내 디자인 애셋</span>
          </span>
        </div>
        <nav>
          <p class="sidebar__section-title">카테고리</p>
          <ul class="category-list" id="category-list"></ul>
        </nav>
      </aside>

      <!-- Topbar -->
      <header class="topbar">
        <button class="topbar__menu-btn" id="menu-btn" aria-label="메뉴 열기">☰</button>
        <div class="search">
          <span class="search__icon" aria-hidden="true">🔍</span>
          <input
            class="search__input"
            id="search-input"
            type="search"
            placeholder="프로젝트명 또는 파일명으로 검색"
            aria-label="검색"
          />
        </div>
        <div class="topbar__spacer"></div>
        <button class="icon-button" id="theme-toggle" aria-label="테마 전환" title="라이트/다크 전환">
          <span id="theme-icon">🌙</span>
        </button>
        <div class="user-chip">
          <span class="user-chip__avatar" id="user-avatar">–</span>
          <span class="user-chip__meta">
            <span class="user-chip__name" id="user-name">사용자</span>
            <span class="role-badge" id="user-role">권한</span>
          </span>
        </div>
        <button class="button button--sm" id="logout-btn">로그아웃</button>
      </header>

      <!-- Main -->
      <main class="main">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">디자인 애셋 갤러리</h1>
            <p class="page-head__subtitle" id="page-subtitle">
              전체 작업물을 이미지 갤러리로 살펴보세요.
            </p>
          </div>
        </div>

        <!-- Overview: donut + summary -->
        <section class="overview">
          <div class="card-panel">
            <div class="card-panel__head">
              <h2 class="card-panel__title">카테고리별 작업물 비율</h2>
              <div class="segmented" id="donut-metric" role="group" aria-label="범례 표기 방식">
                <button class="segmented__btn is-active" type="button" data-metric="count">갯수</button>
                <button class="segmented__btn" type="button" data-metric="percent">%</button>
              </div>
            </div>
            <div class="donut">
              <div class="donut__chart-wrap">
                <svg
                  class="donut__chart"
                  id="donut-chart"
                  viewBox="0 0 42 42"
                  role="img"
                  aria-label="카테고리별 작업물 비율 원형 그래프"
                ></svg>
                <div class="donut__center" aria-hidden="true">
                  <span class="donut__center-value" id="donut-value">–</span>
                  <span class="donut__center-label" id="donut-label">작업물</span>
                </div>
              </div>
              <ul class="donut__legend" id="donut-legend"></ul>
            </div>
          </div>
          <div class="card-panel">
            <h2 class="card-panel__title">요약</h2>
            <div class="summary" id="summary"></div>
          </div>
        </section>

        <!-- Toolbar -->
        <div class="toolbar">
          <span class="toolbar__count" id="result-count">–</span>
          <div class="toolbar__spacer"></div>
          <div class="control">
            <span class="control__label">정렬</span>
            <select class="select" id="sort-select">
              <option value="date">최신순</option>
              <option value="name">파일명순</option>
              <option value="size">용량순</option>
            </select>
            <select class="select" id="order-select">
              <option value="desc">내림차순</option>
              <option value="asc">오름차순</option>
            </select>
          </div>
          <div class="control">
            <span class="control__label">보기</span>
            <div class="viewmode" role="group" aria-label="보기 방식">
              <button class="viewmode__btn is-active" id="view-grid" title="그리드 보기">▦</button>
              <button class="viewmode__btn" id="view-list" title="리스트 보기">☰</button>
            </div>
          </div>
        </div>

        <!-- Gallery -->
        <section class="gallery" id="gallery" aria-live="polite"></section>
        <div class="empty" id="empty-state" hidden>
          검색 결과가 없습니다. 다른 검색어나 카테고리를 선택해 보세요.
        </div>
      </main>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <!-- Edit modal (admin only) -->
    <div class="modal" id="edit-modal" hidden>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="edit-title">
        <h2 class="modal__title" id="edit-title">작업물 편집</h2>
        <div class="field">
          <label class="field__label" for="edit-name">파일명</label>
          <input class="field__input" id="edit-name" type="text" />
        </div>
        <div class="field">
          <label class="field__label" for="edit-category">카테고리</label>
          <select class="select" id="edit-category" style="width: 100%"></select>
        </div>
        <div class="modal__actions">
          <button class="button" id="edit-cancel">취소</button>
          <button class="button button--primary" id="edit-save">저장</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/js/gallery.js"></script>
  </body>
</html>
